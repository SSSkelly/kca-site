<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국콘텐츠아카데미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ink:#1A1A1A;--sub:#666666;--line:#E5E5E5;--bg:#F7F7F7;--accent:#5B4BFF;--accent-d:#4536D6;--accent-l:#EEEBFF}
body{margin:0;background:#FFFFFF;color:#1A1A1A;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6}
a{color:inherit}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid #5B4BFF;outline-offset:2px}
html{scroll-behavior:smooth}
body{word-break:keep-all}
.box .art{left:auto;right:0;width:58%}
[data-show="n"]{display:none !important}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}

/* header */
.hdr{position:relative;background:#FFFFFF;border-bottom:1px solid var(--line)}
.logo{font-size:24px;font-weight:900;letter-spacing:-0.03em;color:var(--ink);text-decoration:none}
.logo b{color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:420px;min-width:0;background:#F2F2F2;border-radius:999px;padding:0 18px;height:42px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.search:focus-within{outline:2px solid #5B4BFF}
.navzone{display:flex;flex-wrap:wrap}
.navzone > a{display:block;padding:14px 20px 12px;font-size:16px;font-weight:700;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent}
.navzone > a:hover,.navzone > a:focus-visible{color:var(--accent);border-bottom-color:var(--accent)}
.mega{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:#FFFFFF;border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 16px 32px rgba(0,0,0,.08)}
.hdr:has(.navzone:hover) .mega,.hdr:has(.navzone:focus-within) .mega,.mega:hover{display:block}
.mega-col a{display:block;padding:5px 0;font-size:14px;color:var(--sub);text-decoration:none}
.mega-col a:hover,.mega-col a:focus-visible{color:var(--accent);text-decoration:underline}
.mega-col h3 a{color:var(--ink);font-size:16px;font-weight:700;padding:0 0 10px}
.mega-col h3 a:hover{color:var(--accent)}
.util a{font-size:14px;color:var(--ink);text-decoration:none}
.util a:hover{color:var(--accent)}

/* hero */
.hero{background:linear-gradient(180deg,#F1EEFF 0%,#FFFFFF 100%);color:var(--ink)}

/* category boxes */
.art{position:absolute;inset:0;width:100%;height:100%}
.box{position:relative;overflow:hidden;box-sizing:border-box;min-height:200px;border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;text-decoration:none;color:var(--ink)}
.box:hover{box-shadow:0 8px 24px rgba(0,0,0,.12)}
[data-w="w"]{flex:1 1 520px}[data-w="n"]{flex:1 1 340px}
[data-tone="1"]{background:#EEEBFF;--m1:#5B4BFF;--m2:#B9B0FF}
[data-tone="2"]{background:#FFE8EF;--m1:#E8346E;--m2:#FF9DB8}
[data-tone="3"]{background:#E3F8F1;--m1:#0FA37A;--m2:#7FE0C0}
[data-tone="4"]{background:#FFF3D6;--m1:#E08A00;--m2:#FFCF66}
[data-tone="5"]{background:#E4F3FF;--m1:#1D7DD8;--m2:#8CC8F5}

/* carousels */
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 8px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc((100% - 40px) / 3);min-width:0;scroll-snap-align:start;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:12px}
.thumb{position:relative;overflow:hidden;aspect-ratio:16 / 10;border-radius:18px;padding:22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.thumb-s{position:relative;font-size:13px;font-weight:700;color:rgba(0,0,0,.55)}
.thumb-t{position:relative;max-width:56%;font-size:22px;font-weight:900;line-height:1.35;letter-spacing:-0.02em;color:#111111}
.slide:hover .cap-t{text-decoration:underline}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid #CCCCCC;background:#FFFFFF;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:900px){.slide{flex-basis:calc((100% - 20px) / 2)}.mega{display:none !important}}
@media (max-width:600px){.slide{flex-basis:84%}.thumb-t{font-size:21px}.hero-h{font-size:36px !important}}

/* free lecture */
.fl-card{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.fl-img{aspect-ratio:16 / 8;background:linear-gradient(135deg,#5B4BFF,#A06BFF);color:#FFFFFF;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:12px}
.cal{background:#F5F5F3;border:1px solid var(--line);border-radius:14px;padding:22px;box-sizing:border-box}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dow{text-align:center;font-size:13px;font-weight:700;padding:6px 0;color:var(--ink)}
.dow[data-sun="y"]{color:#FF4F81}
.day{min-height:72px;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-sizing:border-box;font-size:13px;overflow:hidden}
.day[data-blank="y"]{background:#EDEDEA;border-color:transparent}
.day[data-sun="y"] .dn{color:#FF4F81}
.dn{display:inline-block;min-width:22px;text-align:center;line-height:22px}
.day[data-today="y"] .dn{background:#FF4F81;color:#FFFFFF;border-radius:50%;font-weight:700}
.ev{display:block;margin-top:4px;padding:3px 6px;border-left:3px solid #FF4F81;background:#FFE8EF;font-size:11px;line-height:1.35;color:#7A1030;border-radius:2px;text-decoration:none}
.btn-main{display:inline-block;padding:14px 28px;border:0;border-radius:999px;background:var(--accent);color:#FFFFFF;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn-main:hover{background:var(--accent-d)}
.btn-line{display:inline-block;padding:13px 26px;border:1px solid #BBBBBB;border-radius:999px;background:#FFFFFF;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700}
.inp{height:46px;box-sizing:border-box;width:100%;border:1px solid #BBBBBB;border-radius:8px;padding:0 14px;font-size:15px;background:#FFFFFF;color:var(--ink)}
.inp:focus{outline:2px solid #5B4BFF;border-color:#5B4BFF}
@media (max-width:600px){.day{min-height:54px;padding:4px}.ev{font-size:0;padding:0;height:6px;border-left-width:0;background:#FF4F81}}

</style>
</head>

4" fill="none" stroke-linecap="round"/><circle cx="116" cy="82" r="4" fill="var(--m2)"/></symbol><symbol id="m-smile" viewBox="0 0 160 100"><circle cx="118" cy="52" r="30" fill="var(--m2)" stroke="var(--m1)" stroke-width="4"/><circle cx="108" cy="46" r="4" fill="var(--m1)"/><circle cx="128" cy="46" r="4" fill="var(--m1)"/><path d="M106 58q12 14 24 0" stroke="var(--m1)" stroke-width="5" fill="none" stroke-linecap="round"/></symbol><symbol id="m-goods" viewBox="0 0 160 100"><rect x="94" y="36" width="36" height="42" rx="6" fill="var(--m1)"/><path d="M130 46q16 4 0 22" stroke="var(--m1)" stroke-width="6" fill="none"/><rect x="94" y="50" width="36" height="9" fill="var(--m2)"/><path d="M104 28q4-8 0-12M116 28q4-8 0-12" stroke="var(--m2)" stroke-width="3" fill="none" stroke-linecap="round"/></symbol><symbol id="m-ebook" viewBox="0 0 160 100"><rect x="88" y="26" width="30" height="54" rx="3" fill="var(--m1)"/><rect x="119" y="26" width="30" height="54" rx="3" fill="var(--m2)"/><rect x="94" y="36" width="18" height="4" rx="2" fill="#fff"/><rect x="94" y="46" width="18" height="3" rx="1.5" fill="#fff" opacity=".7"/><rect x="125" y="36" width="18" height="4" rx="2" fill="#fff"/><rect x="125" y="46" width="18" height="3" rx="1.5" fill="#fff" opacity=".7"/></symbol><symbol id="m-class" viewBox="0 0 160 100"><rect x="86" y="22" width="64" height="42" rx="4" fill="var(--m1)"/><rect x="91" y="27" width="54" height="32" rx="2" fill="#fff"/><circle cx="118" cy="38" r="6" fill="var(--m2)"/><path d="M106 58a12 12 0 0 1 24 0Z" fill="var(--m2)"/><rect x="112" y="64" width="12" height="8" fill="var(--m1)"/><rect x="102" y="72" width="32" height="4" rx="2" fill="var(--m1)"/></symbol><symbol id="m-laptop" viewBox="0 0 160 100"><rect x="96" y="26" width="46" height="34" rx="3" fill="var(--m1)"/><rect x="100" y="30" width="38" height="26" fill="#fff"/><rect x="104" y="35" width="16" height="3" rx="1.5" fill="var(--m1)"/><rect x="104" y="42" width="26" height="3" rx="1.5" fill="var(--m2)"/>< " rx="5" fill="var(--m2)"/><rect x="122" y="56" width="28" height="28" rx="5" fill="var(--m1)"/><rect x="96" y="34" width="16" height="4" rx="2" fill="#fff"/><rect x="128" y="34" width="16" height="4" rx="2" fill="#fff"/><rect x="96" y="66" width="16" height="4" rx="2" fill="#fff"/><rect x="128" y="66" width="16" height="4" rx="2" fill="#fff"/></symbol><symbol id="m-sheet" viewBox="0 0 160 100"><rect x="88" y="22" width="62" height="56" rx="4" fill="#fff" stroke="var(--m1)" stroke-width="3"/><rect x="88" y="22" width="62" height="12" rx="3" fill="var(--m1)"/><path d="M108 34V78M129 34V78M88 48H150M88 63H150" stroke="var(--m2)" stroke-width="2.5"/></symbol></defs></svg>

  <header class="hdr">
    <div class="wrap" style="padding-top:16px;padding-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px">
      <a class="logo" href="#top">한국<b>콘텐츠</b>아카데미</a>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" placeholder="어떤 강의를 찾으시나요?" aria-label="강의 검색">
      </div>
      <div class="util" style="margin-left:auto;display:flex;gap:20px">
        <a href="#free">무료 특강</a>
        <a href="#top">나의 강의실</a>
        <a href="#top">로그인</a>
      </div>
    </div>
    <div class="wrap">
      <nav class="navzone" aria-label="주 메뉴">
        <sc-for list="{{menus}}" as="m" hint-placeholder-count="5">
          <a href="{{m.href}}">{{m.name}}</a>
        </sc-for>
      </nav>
    </div>
    <div class="mega">
      <div class="wrap" style="padding-top:28px;padding-bottom:32px;display:flex;gap:24px">
        <sc-for list="{{menus}}" as="m" hint-placeholder-count="5">
          <div class="mega-col" style="flex:1 1 0;min-width:0">
            <h3 style="margin:0"><a href="{{m.href}}">{{m.name}}</a></h3>
            <sc-for list="{{m.subs}}" as="s" hint-placeholder-count="5">
              <a href="{{m.href}}">{{s.name}}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </header>

          ['5-2', '소규모 창업 준비(사업자등록, 인허가)', '창업 준비', 'shield'],
          ['5-3', '판매·홍보(스토어, SNS, 오프라인 영업)', '판매·홍보', 'mega'],
          ['5-4', '원데이클래스·출강·프리랜서 활동', '클래스·프리랜서', 'class']
        ] }
    ];

    const scrollRow = (id, dir) => () => {
      const el = document.getElementById(id);
      if (el) { el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' }); }
    };

    const menus = data.map((d) => ({
      name: d.name,
      href: '#cat-' + d.no,
      subs: d.subs.map((n) => ({ name: n }))
    }));

    const flexes = ['w', 'w', 'n', 'n', 'n'];
    const boxMotifs = ['ai', 'video', 'blog', 'store', 'goods'];
    const boxes = data.map((d, i) => ({
      motif: boxMotifs[i], tag: d.tag, tone: d.tone, href: '#cat-' + d.no, flex: flexes[i],
      title: d.boxTitle, sub: d.boxSub
    }));

    const rows = data.map((d) => ({
      no: d.no, name: d.name, tone: d.tone, lead: d.lead,
      anchor: 'cat-' + d.no, trackId: 'track-' + d.no,
      prev: scrollRow('track-' + d.no, -1),
      next: scrollRow('track-' + d.no, 1),
      cards: d.cards.map((c) => ({ code: c[0], title: c[1], sub: c[2], motif: c[3] }))
    }));

    /* free lecture calendar (sample events) */
    const events = [
      { y: 2026, m: 10, d: 29, time: '20:00', short: 'AI 콘텐츠 제작 특강', title: 'AI 도구로 시작하는 콘텐츠 제작 무료 특강',
        heading: 'AI 활용\n콘텐츠 제작 입문', catchLine: '첫 영상을 만들기까지의 과정을 함께 봅니다', tools: 'ChatGPT · 클로드 · 캡컷 · 노션',
        desc: '같은 콘텐츠를 만들 때 AI 도구를 하나씩 적용해 보며 제작 과정을 줄이는 방법을 비교합니다. 정규 강의를 듣기 전에 수업 방식을 미리 체험하는 온라인 무료 특강입니다.' },
      { y: 2026, m: 11, d: 12, time: '20:00', short: '구매대행 규정 특강', title: '구매대행 시작 전 꼭 확인할 규정 무료 특강',
        heading: '구매대행\n시작 전 체크', catchLine: '통관과 제품안전 규정부터 점검합니다', tools: '구매대행 · 스토어 운영',
        desc: '구매대행을 시작하기 전에 확인해야 할 통관, 제품안전, 표기 규정을 정리하는 온라인 무료 특강입니다.' }
    ];
    const base = new Date(2026, 9 + mo, 1);
    const Y = base.getFullYear();
    const M = base.getMonth() + 1;
    const first = base.getDay();
    const dim = new Date(Y, M, 0).getDate();
    const now = new Date();
    const cells = [];
    for (let i = 0; i < first; i++) { cells.push({ blank: 'y', sun: 'n', today: 'n', day: '', evShow: 'n', evTitle: '' }); }
    for (let d = 1; d <= dim; d++) {
      const ev = events.find((e) => e.y === Y && e.m === M && e.d === d);
      const dow = (first + d - 1) % 7;
      cells.push({
        blank: 'n', sun: dow === 0 ? 'y' : 'n',
        today: (now.getFullYear() === Y && now.getMonth() + 1 === M && now.getDate() === d) ? 'y' : 'n',
        day: String(d), evShow: ev ? 'y' : 'n', evTitle: ev ? ev.short : ''
      });
    }
    while (cells.length % 7 !== 0) { cells.push({ blank: 'y', sun: 'n', today: 'n', day: '', evShow: 'n', evTitle: '' }); }
    const names = ['일', '월', '화', '수', '목', '금', '토'];
    const cal = {
      label: Y + '년 ' + M + '월',
      dows: names.map((n, i) => ({ name: n, sun: i === 0 ? 'y' : 'n' })),
      cells: cells,
      prev: () => this.setState({ mo: mo - 1 }),
      next: () => this.setState({ mo: mo + 1 })
    };

    const cur = events.find((e) => e.y === Y && e.m === M);
    const wd = cur ? names[new Date(cur.y, cur.m - 1, cur.d).getDay()] : '';
    const fl = {
      hasEv: cur ? 'y' : 'n',
      noEv: cur ? 'n' : 'y',
      title: cur ? cur.title : '',
      heading: cur ? cur.heading.replace('\n', ' ') : '',
      catch: cur ? cur.catchLine : '',
      tools: cur ? cur.tools : '',
      desc: cur ? cur.desc : '',
      when: cur ? (cur.y + '.' + cur.m + '.' + cur.d + ' (' + wd + ') ' + cur.time + ' · 한국 시간 · 온라인 · 무료') : '',
      apply: () => {
        this.setState({ open: true, done: false, lecture: cur ? cur.title : '' });
        setTimeout(() => {
          const el = document.getElementById('apply');
          if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }, 50);
      }
    };

    const submit = () => {
      const v = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
      const agree = document.getElementById('f-agree');
      const err = document.getElementById('f-err');
      const show = (msg) => { if (err) { err.textContent = msg; err.setAttribute('data-show', 'y'); } };
      const name = v('f-name');
      const tel = v('f-tel');
      if (!name) { show('이름을 입력해 주세요.'); return; }
      if (tel.replace(/[^0-9]/g, '').length < 9) { show('연락처를 정확히 입력해 주세요.'); return; }
      if (!agree || !agree.checked) { show('개인정보 수집·이용에 동의해 주세요.'); return; }
      this.setState({ done: true, name: name });
    };

    const form = {
      open: s.open ? 'y' : 'n',
      formShow: s.done ? 'n' : 'y',
      doneShow: s.done ? 'y' : 'n',
      name: s.name || '',
      lecture: s.lecture || '',
      submit: submit
    };

    return { menus, boxes, rows, cal, fl, form };
  }
}

const comp = new Component({});
comp.setState = function(p){ this.state = Object.assign({}, this.state, p); render(); };
const tpl = document.getElementById('tpl');
const root = document.getElementById('root');
function get(path, ctx){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), ctx); }
function interp(str, ctx){ return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,p)=>{const v=get(p,ctx);return v==null?'':String(v);}); }
function build(node, ctx){
  if(node.nodeType===3){ return document.createTextNode(interp(node.nodeValue, ctx)); }
  if(node.nodeType!==1) return null;
  if(node.tagName==='SC-FOR'){
    const frag=document.createDocumentFragment();
    const list=get(node.getAttribute('list').replace(/[{}\s]/g,''), ctx)||[];
    const as=node.getAttribute('as');
    list.forEach(item=>{ const c=Object.assign({}, ctx); c[as]=item;
      node.childNodes.forEach(ch=>{const n=build(ch,c); if(n) frag.appendChild(n);}); });
    return frag;
  }
  const svg = node.namespaceURI==='http://www.w3.org/2000/svg';
  const el=svg?document.createElementNS('http://www.w3.org/2000/svg',node.tagName):document.createElement(node.tagName.toLowerCase());
  for(const at of node.attributes){
    if(at.name==='onclick'){
      const fn=get(at.value.replace(/[{}\s]/g,''), ctx);
      if(typeof fn==='function') el.addEventListener('click', ()=>fn());
    } else if(at.name!=='hint-placeholder-count'){ el.setAttribute(at.name, interp(at.value, ctx)); }
  }
  node.childNodes.forEach(ch=>{const n=build(ch,ctx); if(n) el.appendChild(n);});
  return el;
}
function render(){
  const y=window.scrollY;
  const ctx=comp.renderVals();
  root.replaceChildren();
  tpl.content.childNodes.forEach(ch=>{const n=build(ch,ctx); if(n) root.appendChild(n);});
  window.scrollTo(0,y);
}
document.addEventListener('submit',e=>e.preventDefault());
render();
</script>
